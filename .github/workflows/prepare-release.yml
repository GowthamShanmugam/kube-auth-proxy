name: Prepare Release
run-name: Prepare release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v3.5.0-ea.2)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
    - name: Validate version format
      run: |
        VERSION="${{ inputs.version }}"
        if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-ea\.[0-9]+)?$ ]]; then
          echo "::error::Version '$VERSION' does not match expected format (e.g. v3.5.0 or v3.5.0-ea.1)"
          exit 1
        fi

    - name: Check out odh-release branch
      uses: actions/checkout@v4
      with:
        ref: odh-release
        fetch-depth: 0

    - name: Configure git
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create release branch with main merged in
      run: |
        VERSION="${{ inputs.version }}"

        git checkout -b release/${VERSION}
        git merge origin/main -m "merge main into release/${VERSION}"

        # Update output-image tag in tekton push pipeline
        sed -i "s|quay.io/opendatahub/odh-kube-auth-proxy:.*|quay.io/opendatahub/odh-kube-auth-proxy:${VERSION}|" \
          .tekton/kube-auth-proxy-push.yaml

        # Ensure target_branch is odh-release
        sed -i 's/== "main"/== "odh-release"/' \
          .tekton/kube-auth-proxy-push.yaml

        git add .tekton/kube-auth-proxy-push.yaml
        git commit -m "chore: update quay tag for ODH ${VERSION} release"
        git push -u origin release/${VERSION}

    - name: Create pull request
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ inputs.version }}"
        gh pr create \
          --base odh-release \
          --head release/${VERSION} \
          --title "release ${VERSION}" \
          --body "Release branch created by GitHub Actions.

        ### Changes
        - Merged latest commits from \`main\` into \`odh-release\`
        - Updated \`.tekton/kube-auth-proxy-push.yaml\` image tag to \`${VERSION}\`

        ### Next steps
        1. Review and merge this PR
        2. Konflux will build automatically on merge
        3. Once the Konflux build succeeds, the **Tag Release** workflow will auto-trigger to create the tag and GitHub release"
